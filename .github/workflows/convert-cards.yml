name: Convert Star Cards

on:
  push:
    paths:
      - "incoming/**/*.pdf"
      - "incoming/**/*.csv"
      - "tools/card_converter.py"
      - ".github/workflows/convert-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-star-cards
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pymupdf numpy

      - name: Convert incoming card PDFs
        run: |
          python tools/card_converter.py

      - name: Commit converted card files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards/**/*.png cards/**/*.json

          if git diff --cached --quiet; then
            echo "No converted card changes to commit."
            exit 0
          fi

          git commit -m "Convert incoming star card PDFs"

          git pull --rebase --autostash origin main || {
            echo "Could not rebase cleanly. Another edit probably changed cards.json at the same time."
            exit 1
          }

          git push origin main
